name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install pywebview playwright pykakasi pyinstaller

      - name: ソースのままセルフテスト
        run: python app.py --selftest

      - name: PyInstallerで.app化
        run: >
          pyinstaller --noconfirm --windowed --name RankChecker
          --icon assets/app.icns
          --osx-bundle-identifier jp.yuoda.rank-checker
          --collect-all playwright
          --collect-all webview
          --collect-all pykakasi
          app.py

      - name: UIとアセットを同梱して再署名
        run: |
          # データファイルはContents/MacOSに置くと署名できないのでResourcesへ
          cp ui.html dist/RankChecker.app/Contents/Resources/
          ditto assets dist/RankChecker.app/Contents/Resources/assets
          codesign --force -s - dist/RankChecker.app
          codesign --verify dist/RankChecker.app

      - name: .appのセルフテスト
        run: ./dist/RankChecker.app/Contents/MacOS/RankChecker --selftest

      - name: 配布フォルダを組み立ててZIP化
        run: |
          mkdir -p "package/順位チェッカーMac版"
          mv dist/RankChecker.app "package/順位チェッカーMac版/順位チェッカー.app"
          cp "packaging/はじめにお読みください-mac.txt" "package/順位チェッカーMac版/はじめにお読みください.txt"
          cd package
          ditto -c -k --keepParent "順位チェッカーMac版" ../rank-checker-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rank-checker-macos
          path: rank-checker-mac.zip

      - name: タグpush時はReleasesに添付
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes="Windows版: rank-checker-win.zip を展開して「セットアップ.bat」を実行。Mac版(Apple Silicon): rank-checker-mac.zip を展開して「順位チェッカー.app」を右クリック→開く。詳しくは各ZIP同梱の「はじめにお読みください.txt」へ。"
          gh release create "$tag" rank-checker-mac.zip --title "順位チェッカー $tag" --notes "$notes" \
            || gh release upload "$tag" rank-checker-mac.zip --clobber
