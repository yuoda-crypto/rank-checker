name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install pywebview playwright pykakasi pyinstaller

      - name: ソースのままセルフテスト
        run: python app.py --selftest

      - name: PyInstallerでexe化
        run: >
          pyinstaller --noconfirm --noconsole --name RankChecker
          --icon assets/app.ico
          --collect-all playwright
          --collect-all webview
          --collect-all pykakasi
          app.py

      - name: UIとアセットを同梱
        shell: pwsh
        run: |
          Copy-Item ui.html dist/RankChecker/
          Copy-Item -Recurse assets dist/RankChecker/assets

      - name: exeのセルフテスト
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/RankChecker/RankChecker.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed (exit $($p.ExitCode))"; exit 1 }

      - name: 配布フォルダを組み立ててZIP化
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "package/順位チェッカーWin版" -Force | Out-Null
          Copy-Item -Recurse dist/RankChecker "package/順位チェッカーWin版/app"
          # batは日本語Windowsのcmdが読めるようShift-JISに変換して同梱
          $sjis = [System.Text.Encoding]::GetEncoding(932)
          $bat = Get-Content -Raw -Encoding UTF8 "packaging/セットアップ.bat"
          [System.IO.File]::WriteAllText("$PWD/package/順位チェッカーWin版/セットアップ.bat", $bat, $sjis)
          # txtはメモ帳で確実に開けるようBOM付きUTF-8
          $txt = Get-Content -Raw -Encoding UTF8 "packaging/はじめにお読みください.txt"
          Set-Content -Path "package/順位チェッカーWin版/はじめにお読みください.txt" -Value $txt -Encoding utf8BOM -NoNewline
          # 日本語ファイル名が化けないよう7-ZipでUTF-8フラグ付きZIPにする
          cd package
          7z a -tzip -mcu=on ../rank-checker-win.zip "順位チェッカーWin版"

      - uses: actions/upload-artifact@v4
        with:
          name: rank-checker-windows
          path: rank-checker-win.zip

      - name: タグpush時はReleasesに添付
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag rank-checker-win.zip --title "順位チェッカー $tag" --notes "Windows版: rank-checker-win.zip を展開して「セットアップ.bat」を実行。Mac版(Apple Silicon): rank-checker-mac.zip を展開して「順位チェッカー.app」を右クリック→開く。詳しくは各ZIP同梱の「はじめにお読みください.txt」へ。"
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag rank-checker-win.zip --clobber
          }
